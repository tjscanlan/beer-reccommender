<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Beer Recommender</title>
  <meta name="description" content="Find your next favorite beer">

  <!-- PWA / iOS home-screen app -->
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#1c130a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Beers">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="/icons/icon-192.png">

  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="app-header">
    <h1>🍺 Beer Recommender</h1>
    <p class="tagline">Tell us what you drink. We'll pour the next round.</p>
  </header>

  <main>
    <section class="card">
      <h2>1 · Pick beers you already like</h2>
      <input id="beer-search" type="search" placeholder="Search beers, breweries, styles…" autocomplete="off">
      <div id="beer-grid" class="beer-grid" aria-live="polite"></div>
      <p id="picked-count" class="hint">Nothing picked yet — tap a few favorites.</p>
    </section>

    <section class="card">
      <h2>2 · Describe your taste <span class="optional">(optional)</span></h2>
      <textarea id="taste-text" rows="2"
        placeholder="e.g. juicy hazy IPAs, nothing too bitter… or dark coffee stouts"></textarea>
    </section>

    <button id="recommend-btn" class="cta">Get my recommendations</button>

    <section id="results" class="results" hidden>
      <h2>Your next round 🍻</h2>
      <p id="personalized-note" class="hint" hidden>✨ Explanations personalized by Claude</p>
      <div id="results-list"></div>
      <button id="reset-btn" class="secondary">Start over</button>
    </section>
  </main>

  <footer>
    <p>Built with FastAPI + Claude · beer data bundled locally</p>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
